name: CI

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ============================================================
  # Backend Tests
  # ============================================================
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: quantheonix_ci
          POSTGRES_USER: quantheonix_ci
          POSTGRES_PASSWORD: ci_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U quantheonix_ci -d quantheonix_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      JWT_SECRET_KEY: "ci_test_jwt_secret_key_123456789012345678901234567890"
      GEMINI_API_KEY: "ci_test_gemini_key"
      DATABASE_URL: "postgresql+asyncpg://quantheonix_ci:ci_only_password@localhost:5432/quantheonix_ci"
      ENVIRONMENT: "testing"
      DEBUG: "false"
      JWT_ALGORITHM: "HS256"
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      REFRESH_TOKEN_EXPIRE_DAYS: "7"
      CORS_ORIGINS: '["http://localhost:5173"]'
      RATE_LIMIT_ENABLED: "false"

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run database migrations
        run: alembic upgrade head

      - name: Verify database revision
        run: alembic current

      - name: Run backend tests
        run: python -m pytest -v

  # ============================================================
  # NPM Package Validation
  # ============================================================
  npm-package:
    name: NPM Package
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: packages/quantheonix-chatbot

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: packages/quantheonix-chatbot/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint package
        run: npm run lint

      - name: Build package
        run: npm run build

      - name: Validate npm package
        run: npm pack --dry-run


  # ============================================================
  # Docker Validation
  # ============================================================
  docker-validation:
    name: Docker Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate backend Docker image
        run: |
          docker build \
            -t quantheonix-backend-ci \
            ./backend

      - name: Validate self-hosted Compose
        env:
          POSTGRES_DB: quantheonix_ci
          POSTGRES_USER: quantheonix_ci
          POSTGRES_PASSWORD: ci_only_password
          GEMINI_API_KEY: ci_placeholder_key
          JWT_SECRET_KEY: ci_only_jwt_secret_key_not_for_production
          CORS_ORIGINS: '["http://localhost:5173"]'
        run: |
          docker compose \
            -f compose.selfhosted.yaml \
            config >/dev/null

          echo "Compose configuration valid"