name: CI

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ============================================================
  # Backend Tests
  # ============================================================
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # The backend uses pydantic-settings and expects a .env file.
      # These are CI-only placeholder values.
      # No real API keys or production secrets are used here.
      - name: Create CI environment
        run: |
          cat > .env <<'EOF'
          JWT_SECRET_KEY=ci_test_jwt_secret_key_123456789012345678901234567890
          JWT_ALGORITHM=HS256
          ACCESS_TOKEN_EXPIRE_MINUTES=30
          REFRESH_TOKEN_EXPIRE_DAYS=7

          GEMINI_API_KEY=ci_test_gemini_key
          GEMINI_MODEL=gemini-flash-latest
          GEMINI_TEMPERATURE=0.7

          DATABASE_URL=postgresql+asyncpg://ci_user:ci_password@localhost:5432/quantheonix_ci

          CORS_ORIGINS=["http://localhost:5173"]

          DEBUG=false
          API_V1_PREFIX=/api/v1

          RATE_LIMIT_ENABLED=true
          RATE_LIMIT_LOGIN_REQUESTS=10
          RATE_LIMIT_REGISTER_REQUESTS=5
          RATE_LIMIT_REFRESH_REQUESTS=30
          RATE_LIMIT_CHAT_REQUESTS=20
          RATE_LIMIT_WINDOW_SECONDS=60
          EOF

      - name: Verify CI configuration
        run: |
          python -c "from app.core.config import settings; print('JWT:', bool(settings.jwt_secret_key)); print('Gemini:', bool(settings.gemini_api_key)); print('DB:', bool(settings.database_url))"

      - name: Run backend tests
        run: |
          export JWT_SECRET_KEY="ci_test_jwt_secret_key_123456789012345678901234567890"
          export GEMINI_API_KEY="ci_test_gemini_key"
          export DATABASE_URL="postgresql+asyncpg://ci_user:ci_password@localhost:5432/quantheonix_ci"
          export ENVIRONMENT="testing"
          export DEBUG="false"

          python -c "import os; print('JWT:', bool(os.getenv('JWT_SECRET_KEY'))); print('Gemini:', bool(os.getenv('GEMINI_API_KEY'))); print('DB:', bool(os.getenv('DATABASE_URL')))"

          python -c "from app.core.config import settings; print('Settings JWT:', bool(settings.jwt_secret_key)); print('Settings Gemini:', bool(settings.gemini_api_key)); print('Settings DB:', bool(settings.database_url))"

          python -m pytest -v


  # ============================================================
  # NPM Package Validation
  # ============================================================
  npm-package:
    name: NPM Package
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: packages/quantheonix-chatbot

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: packages/quantheonix-chatbot/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint package
        run: npm run lint

      - name: Build package
        run: npm run build

      - name: Validate npm package
        run: npm pack --dry-run


  # ============================================================
  # Docker Validation
  # ============================================================
  docker-validation:
    name: Docker Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate backend Docker image
        run: |
          docker build \
            -t quantheonix-backend-ci \
            ./backend

      - name: Validate self-hosted Compose
        env:
          POSTGRES_DB: quantheonix_ci
          POSTGRES_USER: quantheonix_ci
          POSTGRES_PASSWORD: ci_only_password
          GEMINI_API_KEY: ci_placeholder_key
          JWT_SECRET_KEY: ci_only_jwt_secret_key_not_for_production
          CORS_ORIGINS: '["http://localhost:5173"]'
        run: |
          docker compose \
            -f compose.selfhosted.yaml \
            config >/dev/null

          echo "Compose configuration valid"