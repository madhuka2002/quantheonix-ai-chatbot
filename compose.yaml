services:
  postgres:
    image: postgres:17-alpine
    container_name: quantheonix-dev-postgres

    environment:
      POSTGRES_DB: quantheonix_chatbot
      POSTGRES_USER: quantheonix_user
      POSTGRES_PASSWORD: user123

    ports:
      - "5433:5432"

    volumes:
      - quantheonix_dev_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U quantheonix_user -d quantheonix_chatbot"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

    restart: unless-stopped


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: quantheonix-backend

    env_file:
      - ./backend/.env.docker

    environment:
      DATABASE_URL: postgresql+asyncpg://quantheonix_user:user123@postgres:5432/quantheonix_chatbot

    ports:
      - "8000:8000"

    depends_on:
      postgres:
        condition: service_healthy

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

      args:
        VITE_API_BASE_URL: http://127.0.0.1:8000

    container_name: quantheonix-frontend

    ports:
      - "8080:80"

    depends_on:
      backend:
        condition: service_healthy

    restart: unless-stopped


volumes:
  quantheonix_dev_postgres_data:
    name: quantheonix_dev_postgres_data