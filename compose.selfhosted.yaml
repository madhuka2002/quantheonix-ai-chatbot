services:
  postgres:
    image: postgres:17-alpine
    container_name: ${POSTGRES_CONTAINER_NAME:-quantheonix-postgres}

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-quantheonix_chatbot}
      POSTGRES_USER: ${POSTGRES_USER:-quantheonix_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.selfhosted}

    volumes:
      - quantheonix_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-quantheonix_user} -d ${POSTGRES_DB:-quantheonix_chatbot}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

    restart: unless-stopped


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: ${BACKEND_CONTAINER_NAME:-quantheonix-backend}

    environment:
      APP_NAME: Quantheonix AI Chatbot API
      APP_VERSION: 1.0.0
      ENVIRONMENT: production
      DEBUG: "false"
      API_V1_PREFIX: /api/v1

      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-flash-latest}
      GEMINI_TEMPERATURE: ${GEMINI_TEMPERATURE:-0.7}
      PROVIDER_KEY_ENCRYPTION_SECRET: ${PROVIDER_KEY_ENCRYPTION_SECRET:?Set PROVIDER_KEY_ENCRYPTION_SECRET in .env.selfhosted}

      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-quantheonix_user}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.selfhosted}@postgres:5432/${POSTGRES_DB:-quantheonix_chatbot}

      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env.selfhosted}
      JWT_ALGORITHM: HS256

      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}

      CORS_ORIGINS: '${CORS_ORIGINS:-[]}'

      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_LOGIN_REQUESTS: ${RATE_LIMIT_LOGIN_REQUESTS:-10}
      RATE_LIMIT_REGISTER_REQUESTS: ${RATE_LIMIT_REGISTER_REQUESTS:-5}
      RATE_LIMIT_REFRESH_REQUESTS: ${RATE_LIMIT_REFRESH_REQUESTS:-30}
      RATE_LIMIT_CHAT_REQUESTS: ${RATE_LIMIT_CHAT_REQUESTS:-20}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}

    depends_on:
      postgres:
        condition: service_healthy

    command:
      - sh
      - -c
      - |
        set -e
        echo "Applying database migrations..."
        alembic upgrade head
        echo "Starting Quantheonix backend..."
        exec uvicorn main:app --host 0.0.0.0 --port 8000

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

    restart: unless-stopped


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: ${FRONTEND_CONTAINER_NAME:-quantheonix-frontend}

    ports:
      - "${DASHBOARD_BIND_ADDRESS:-127.0.0.1}:${DASHBOARD_PORT:-8080}:80"

    depends_on:
      backend:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--output-document=/dev/null",
          "http://127.0.0.1/"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    restart: unless-stopped


volumes:
  quantheonix_postgres_data:
    name: ${POSTGRES_VOLUME_NAME:-quantheonix_postgres_data}
