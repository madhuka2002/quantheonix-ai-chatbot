services:
  postgres:
    image: postgres:17-alpine
    container_name: quantheonix-postgres

    environment:
      POSTGRES_DB: quantheonix_chatbot
      POSTGRES_USER: quantheonix_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - quantheonix_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U quantheonix_user -d quantheonix_chatbot"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

    restart: unless-stopped


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: quantheonix-backend

    environment:
      APP_NAME: Quantheonix AI Chatbot API
      APP_VERSION: 1.0.0
      ENVIRONMENT: production
      DEBUG: "false"
      API_V1_PREFIX: /api/v1

      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-flash-latest}
      GEMINI_TEMPERATURE: ${GEMINI_TEMPERATURE:-0.7}

      DATABASE_URL: postgresql+asyncpg://quantheonix_user:${POSTGRES_PASSWORD}@postgres:5432/quantheonix_chatbot

      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: HS256

      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}

      CORS_ORIGINS: ${CORS_ORIGINS}

      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_LOGIN_REQUESTS: ${RATE_LIMIT_LOGIN_REQUESTS:-10}
      RATE_LIMIT_REGISTER_REQUESTS: ${RATE_LIMIT_REGISTER_REQUESTS:-5}
      RATE_LIMIT_REFRESH_REQUESTS: ${RATE_LIMIT_REFRESH_REQUESTS:-30}
      RATE_LIMIT_CHAT_REQUESTS: ${RATE_LIMIT_CHAT_REQUESTS:-20}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}

    ports:
      - "8000:8000"

    depends_on:
      postgres:
        condition: service_healthy

    command:
      - sh
      - -c
      - |
        echo "Applying database migrations..."
        alembic upgrade head
        echo "Starting Quantheonix backend..."
        exec uvicorn main:app --host 0.0.0.0 --port 8000

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    restart: unless-stopped


volumes:
  quantheonix_postgres_data:
    name: quantheonix_postgres_data